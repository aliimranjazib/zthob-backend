<section class="section">
  <div class="banner">
    <div class="brand">{{ brand }}</div>
    <div class="meta">
      <strong>{{ labels.receipt }}</strong><br>
      <span class="sub">{{ order.number }}</span>
    </div>
  </div>
  <div class="status-strip">
    <strong>{{ labels.status_label }}</strong> {{ order.status }}
    &nbsp;·&nbsp;
    <strong>{{ labels.tailor_status_label }}</strong> {{ order.tailor_status }}
    &nbsp;·&nbsp;
    <strong>{{ labels.placed_label }}</strong> {{ order.placed_at }}
  </div>
</section>
