<section class="section">
  <div class="section-title">{{ labels.notes }}</div>
  <div class="gold-rule"></div>
  {% if order.special_instructions %}
    <div class="note"><strong>{{ labels.special_instructions }}</strong> {{ order.special_instructions }}</div>
  {% endif %}
  {% if order.notes %}
    <div class="note"><strong>{{ labels.internal_notes }}</strong> {{ order.notes }}</div>
  {% endif %}
</section>
