<!DOCTYPE html>
<html lang="{{ lang }}" dir="{% if is_rtl %}rtl{% else %}ltr{% endif %}" class="{% if is_rtl %}doc-rtl{% else %}doc-ltr{% endif %}">
<head>
  <meta charset="utf-8">
  <title>{{ labels.receipt }} {{ order.number }}</title>
  <style>
    @font-face {
      font-family: "IBMPlexSansArabic";
      src: url("{{ fonts.regular }}");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "IBMPlexSansArabic";
      src: url("{{ fonts.bold }}");
      font-weight: 700;
      font-style: normal;
    }
    @page {
      size: A4;
      margin: 10mm 10mm 12mm 10mm;
      @bottom-center {
        content: "{{ labels.page }} " counter(page);
        font-family: "IBMPlexSansArabic", Helvetica, sans-serif;
        font-size: 8pt;
        color: #666;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      color: #333;
      font-family: "IBMPlexSansArabic", Helvetica, sans-serif;
      font-size: 8.5pt;
    }
    .doc-rtl {
      text-align: right;
    }
    .doc-rtl .section-title {
      text-transform: none;
      letter-spacing: 0;
    }
    .doc-rtl .kv th,
    .doc-rtl .kv td,
    .doc-rtl .meta-grid td,
    .doc-rtl .note,
    .doc-rtl .person-head,
    .doc-rtl .status-strip,
    .doc-rtl table.history th,
    .doc-rtl table.history td {
      text-align: right;
    }
    .doc-rtl .two-col td { padding: 0 0 0 4pt; }
    .doc { width: 100%; }
    .section { margin-bottom: 8pt; page-break-inside: avoid; }
    .section-title {
      color: #990404;
      font-size: 9pt;
      font-weight: 700;
      letter-spacing: 0.3px;
      margin: 0 0 3pt;
      text-transform: uppercase;
    }
    .gold-rule {
      height: 1pt;
      background: #C9A84C;
      margin: 0 0 5pt;
    }
    .banner {
      background: #990404;
      color: #fff;
      display: table;
      width: 100%;
      padding: 8pt 10pt;
    }
    .banner .brand, .banner .meta {
      display: table-cell;
      vertical-align: middle;
    }
    .banner .brand { font-size: 18pt; font-weight: 700; }
    .banner .meta { text-align: {% if is_rtl %}left{% else %}right{% endif %}; font-size: 8pt; }
    .banner .meta .sub { color: #ccc; }
    .status-strip {
      background: #F5F5F5;
      border: 0.4pt solid #ddd;
      border-top: none;
      padding: 4pt 8pt;
      font-size: 7.5pt;
    }
    .kv {
      width: 100%;
      border-collapse: collapse;
    }
    .kv th, .kv td {
      border: 0.25pt solid #ddd;
      padding: 4pt 6pt;
      vertical-align: top;
      text-align: inherit;
    }
    .kv th {
      background: #F5F5F5;
      color: #666;
      font-size: 7pt;
      font-weight: 700;
    }
    .two-col { width: 100%; border-collapse: collapse; }
    .two-col td { width: 50%; vertical-align: top; padding: 0 4pt 0 0; }
    .person {
      border: 0.5pt solid #ddd;
      margin-bottom: 10pt;
      page-break-inside: avoid;
    }
    .person-head {
      background: #990404;
      color: #fff;
      padding: 5pt 8pt;
      font-weight: 700;
      font-size: 9pt;
    }
    .person-body { padding: 6pt; }
    .meta-grid {
      width: 100%;
      border-collapse: collapse;
      background: #F5F5F5;
      margin-bottom: 6pt;
    }
    .meta-grid td {
      border: 0.25pt solid #ddd;
      padding: 4pt 6pt;
      width: 33.33%;
      vertical-align: top;
    }
    .meas-grid {
      display: grid;
      width: 100%;
      border: 0.5pt solid #ddd;
      grid-auto-rows: minmax(28pt, auto);
    }
    .meas-grid.meas-grid-fixed-cols {
      direction: ltr;
    }
    .meas-cell {
      position: relative;
      border: 0.25pt solid #ddd;
      padding: 4pt 5pt 4pt 5pt;
      min-height: 28pt;
      background: #fff;
    }
    .meas-cell:nth-child(even) { background: #F5F5F5; }
    .meas-seq {
      position: absolute;
      top: 2pt;
      inset-inline-end: 4pt;
      color: #C9A84C;
      font-size: 6.5pt;
      font-weight: 700;
      line-height: 1;
    }
    .meas-label {
      color: #C9A84C;
      font-size: 6.5pt;
      font-weight: 700;
      text-transform: uppercase;
    }
    .doc-rtl .meas-label {
      text-transform: none;
      direction: rtl;
      text-align: right;
      unicode-bidi: plaintext;
    }
    .meas-value { font-size: 9pt; font-weight: 700; }
    .doc-rtl .meas-value {
      direction: rtl;
      text-align: right;
      unicode-bidi: plaintext;
    }
    .doc-rtl .meas-cell {
      text-align: right;
    }
    .meas-cell-empty .meas-value { color: #999; font-weight: 400; }
    .styles {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4pt;
      margin-top: 4pt;
    }
    .style-card { text-align: center; font-size: 6.5pt; }
    .style-card img { max-width: 36pt; max-height: 36pt; }
    .photos img { max-width: 48pt; max-height: 48pt; margin: 2pt; }
    .note { margin: 3pt 0; }
    .comments-box {
      border: 0.7pt solid #ddd;
      height: 22pt;
      background: #fff;
    }
    .footer {
      color: #666;
      font-size: 7pt;
      text-align: center;
      margin-top: 4pt;
    }
    table.history { width: 100%; border-collapse: collapse; }
    table.history th {
      background: #990404;
      color: #fff;
      font-size: 7pt;
      padding: 3pt 5pt;
      text-align: inherit;
    }
    table.history td {
      border: 0.3pt solid #ddd;
      padding: 3pt 5pt;
      vertical-align: top;
    }
    table.history tr:nth-child(even) td { background: #F5F5F5; }
  </style>
</head>
<body>
  <div class="doc">
    {% for html in section_html %}
      {{ html|safe }}
    {% endfor %}
  </div>
</body>
</html>
